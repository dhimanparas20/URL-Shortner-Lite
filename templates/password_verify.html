<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Required - MST URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="static/link.png">
    <style>
        body {
            background: #0a0a0f;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .lock-card {
            background: linear-gradient(145deg, #13131a 0%, #1a1a2e 100%);
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 1.25rem;
            box-shadow: 0 8px 40px rgba(80, 0, 200, 0.12);
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .lock-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 1.75rem;
        }
        .lock-title {
            color: #a78bfa;
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }
        .lock-subtitle {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .form-label { color: #c4b5fd; font-weight: 500; font-size: 0.875rem; }
        .form-control {
            background: #1e1e2e;
            border: 1px solid #2d2d44;
            color: #fff;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
            background: #1e1e2e;
            color: #fff;
        }
        .btn-unlock {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            color: #fff;
            font-weight: 600;
            border: none;
            border-radius: 0.75rem;
            padding: 0.75rem;
            width: 100%;
            font-size: 1rem;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }
        .btn-unlock:hover {
            background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
            color: #fff;
        }
        .alert-error {
            border-radius: 0.75rem;
            font-size: 0.875rem;
            padding: 0.75rem 1rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            margin-bottom: 1rem;
            text-align: left;
        }
        .back-link {
            color: #6b7280;
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: #a78bfa; }
    </style>
</head>
<body>
    <div class="lock-card shadow-lg">
        <div class="lock-icon">&#128274;</div>
        <h1 class="lock-title">Password Required</h1>
        <p class="lock-subtitle">This short URL is protected. Enter the password to continue.</p>
        {% if error %}
        <div class="alert-error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/{{ short_url }}">
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="Enter password" autofocus>
            </div>
            <button type="submit" class="btn btn-unlock">Unlock & Continue</button>
        </form>
        <div class="text-center mt-4">
            <a href="/" class="back-link">&larr; Back to URL Shortener</a>
        </div>
    </div>
</body>
</html>
