<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Not Found - MST URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="static/link.png">
    <style>
        body {
            background: #000;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mst-card {
            background: #18181b;
            border-radius: 1rem;
            box-shadow: 0 4px 32px 0 rgba(80, 0, 120, 0.15);
            padding: 2rem;
            max-width: 420px;
            margin: auto;
            text-align: center;
        }
        .mst-title {
            color: #a78bfa;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            color: #8b5cf6;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .error-message {
            color: #c4b5fd;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }
        .btn-purple {
            background: linear-gradient(90deg, #8b5cf6 0%, #6d28d9 100%);
            color: #fff;
            font-weight: 600;
            border: none;
            padding: 0.6rem 2rem;
            border-radius: 0.5rem;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-purple:hover, .btn-purple:focus {
            background: linear-gradient(90deg, #7c3aed 0%, #5b21b6 100%);
            color: #fff;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="mst-card shadow-lg">
            <div class="icon-circle">&#128279;</div>
            <h1 class="error-code">404</h1>
            <h2 class="mst-title mb-3">URL Not Found</h2>
            <p class="error-message">
                This short URL doesn't exist or has expired.<br>
                Create a new shortened URL below.
            </p>
            <a href="/" class="btn-purple">Create New URL</a>
        </div>
    </div>
</body>
</html>
